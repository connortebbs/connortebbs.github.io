<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 370" role="img" aria-label="Free body diagram of horizontal tensile force applied above the supported post"><defs><marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7z" fill="#b83d38"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7z" fill="#2b6aa6"/></marker></defs><rect width="650" height="370" rx="10" fill="#f2f5f7"/><g font-family="Arial,sans-serif" fill="#203448" font-size="15"><text x="22" y="30" font-size="18" font-weight="bold">Post support reactions</text><text x="22" y="51" font-size="12">Idealized static two-contact model</text><rect x="264" y="152" width="101" height="174" rx="4" fill="#ccd6de" stroke="#8493a0"/><rect x="304" y="72" width="22" height="250" fill="#32a4a0" stroke="#117575"/><rect x="284" y="144" width="62" height="8" fill="#32a4a0"/><path d="M304 82H143" stroke="#b83d38" stroke-width="3" marker-end="url(#r)"/><text x="145" y="72" fill="#b83d38">T = tensile load</text><path d="M326 156H437" stroke="#2b6aa6" stroke-width="3" marker-end="url(#b)"/><text x="444" y="161" fill="#2b6aa6">R upper</text><path d="M304 320H192" stroke="#2b6aa6" stroke-width="3" marker-end="url(#b)"/><text x="112" y="325" fill="#2b6aa6">R lower</text><g stroke="#526575" stroke-width="1.5" fill="none"><path d="M332 82H510 M368 156H510 M368 320H510" stroke-dasharray="5 4"/><path d="M506 82V156 M499 82H513 M499 156H513 M506 161V320 M499 320H513"/></g><text x="518" y="120">h = 49.5 mm</text><text x="518" y="238">L = 72.5 mm</text><text x="25" y="226">Longer supported</text><text x="25" y="245">engagement</text><path d="M160 230H260" stroke="#526575"/><text x="22" y="353" font-size="12">Not a pressure distribution or a measured load case.</text></g></svg>